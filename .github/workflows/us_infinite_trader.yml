name: US Infinite Buying Auto Trader

on:
  schedule:
    # Mon-Fri 22:15 KST (13:15 UTC) - before/near US market open
    - cron: "15 13 * * 1-5"
  workflow_dispatch:
    inputs:
      force_run:
        description: "Force run even on US holiday"
        required: false
        default: "false"

jobs:
  run-us-infinite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run US Infinite Buying (No Git Commit - Personal Sheet Only)
        env:
          USER_ID: ${{ secrets.USER_ID }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          KIS_ACCOUNT_NO: ${{ secrets.KIS_ACCOUNT_NO }}
          IS_MOCK: ${{ secrets.IS_MOCK }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
          US_INFINITE_SYMBOLS: ${{ secrets.US_INFINITE_SYMBOLS }}
          FORCE_RUN: ${{ github.event.inputs.force_run }}
        run: python scripts/run_us_infinite_actions.py
